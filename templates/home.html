{% extends "base.html" %}

{% block content %}
{% if user.is_authenticated %}
<p>Hi {{ user.username }} you're {{user.age}} years old.</p>
<form action="{% url 'logout' %}" method="post">
    {% csrf_token %}
    <button type="submit">Log out</button>
</form>
<p><a class="btn btn-primary" href="{% url 'article_list' %}">View all articles</a></p>
{% else %}
<a href="{% url 'login' %}">Log in</a>
<a href="{% url 'signup' %}">Sign up</a>
{% endif %}
{% endblock content %}
